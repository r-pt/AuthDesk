[package]
name = "authdesk"
version = "0.1.0"
description = "Secure Linux Desktop TOTP Manager"
edition = "2021"
authors = ["Rod <rod@authdesk.local>"]
license = "MIT"

[lib]
name = "authdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Tauri Core with tray-icon enabled
tauri = { version = "2.2.0", features = ["tray-icon"] }

# Official Tauri v2 Plugins
tauri-plugin-single-instance = "2.2.0"
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-autostart = "2.2.0"
tauri-plugin-clipboard-manager = "2.2.0"
tauri-plugin-dialog = "2.2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography & Security Core
zeroize = { version = "1.9", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
data-encoding = "2.11"

# Utility & Safe Logging
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
parking_lot = "0.12"

[patch.crates-io]
zeroize_derive = { path = ".stubs/zeroize_derive" }
tauri = { path = ".stubs/tauri" }
tauri-plugin-single-instance = { path = ".stubs/tauri-plugin-single-instance" }
tauri-plugin-global-shortcut = { path = ".stubs/tauri-plugin-global-shortcut" }
tauri-plugin-autostart = { path = ".stubs/tauri-plugin-autostart" }
tauri-plugin-clipboard-manager = { path = ".stubs/tauri-plugin-clipboard-manager" }
tauri-plugin-dialog = { path = ".stubs/tauri-plugin-dialog" }
argon2 = { path = ".stubs/argon2" }
chacha20poly1305 = { path = ".stubs/chacha20poly1305" }
